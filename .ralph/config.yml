# yaml-language-server: $schema=https://raw.githubusercontent.com/shuymn/ralph/main/schemas/config.schema.json
version: "1"

agent:
  run_command: "codex --profile ralph exec"

completion:
  run:
    strategy: tail_match
    signal: "<promise>COMPLETE</promise>"
    tail_lines: 20
  review:
    strategy: review_convergence
    signal: "<promise>COMPLETE</promise>"
    review_convergence:
      min_reviews: 3
      max_reviews: 10
      judge_every: 2
      stable_rounds: 2

git:
  commit: split
  fallback_message: "feat: implement task (auto-commit)"
  fallback_no_gpg_sign: true

phases:
  pre:
    steps: []
  post:
    steps:
      - name: quality gate
        run: go mod tidy && task check
      - name: auto_commit
        uses: auto_commit
        if: changed()
        on_fail: stop_loop
