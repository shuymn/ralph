# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BINARY_NAME: ralph
  COVERAGE_FILE: coverage.out
  BIN_DIR: bin
  GOLANGCI_LINT_VERSION: v2.10.1
  ROOT_DIR_ABS:
    sh: pwd
  CACHE_DIR: "{{.ROOT_DIR_ABS}}/.cache"
  GO_BUILD_CACHE: "{{.CACHE_DIR}}/go-build"
  GO_MOD_CACHE: "{{.CACHE_DIR}}/gomod"
  GO_PATH: "{{.CACHE_DIR}}/gopath"
  GOLANGCI_CACHE: "{{.CACHE_DIR}}/golangci-lint"

env:
  GOCACHE: "{{.GO_BUILD_CACHE}}"
  GOMODCACHE: "{{.GO_MOD_CACHE}}"
  GOPATH: "{{.GO_PATH}}"
  GOLANGCI_LINT_CACHE: "{{.GOLANGCI_CACHE}}"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}"
    cmds:
      - go build -o {{.BINARY_NAME}} .

  clean:
    desc: Remove build artifacts and coverage files
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f {{.COVERAGE_FILE}} coverage.html
      - go clean

  run:
    desc: Build and run the extension
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}}

  test:
    desc: Run tests with race detection and shuffle (10 times)
    cmds:
      - go test -race -shuffle=on -count=10 ./...

  test:coverage:
    desc: Run tests with coverage report
    preconditions:
      - sh: command -v octocov
        msg: "octocov is not installed. Please install it first."
    cmds:
      - go test -race -coverprofile={{.COVERAGE_FILE}} ./...
      - octocov ls-files

  install:golangci-lint:
    desc: Install golangci-lint
    vars:
      CURRENT_VERSION:
        sh: '{{.BIN_DIR}}/golangci-lint version 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p" || echo ""'
    status:
      - test -f {{.BIN_DIR}}/golangci-lint
      - test "v{{.CURRENT_VERSION}}" = "{{.GOLANGCI_LINT_VERSION}}"
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b {{.BIN_DIR}} {{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Run golangci-lint
    deps:
      - task: install:golangci-lint
        silent: true
    cmds:
      - cmd: "{{.BIN_DIR}}/golangci-lint version"
        silent: true
      - "{{.BIN_DIR}}/golangci-lint run"

  fmt:
    desc: Format code using golangci-lint
    deps:
      - task: install:golangci-lint
        silent: true
    cmds:
      - cmd: "{{.BIN_DIR}}/golangci-lint version"
        silent: true
      - "{{.BIN_DIR}}/golangci-lint fmt"

  schema:
    desc: Regenerate config schema artifact
    cmds:
      - go run ./cmd/ralph

  schema:check:
    desc: Verify config schema artifact has no drift
    deps:
      - task: schema
        silent: true
    cmds:
      - git diff --exit-code -- schemas/config.schema.json

  check:
    desc: Run all checks (schema drift, lint, build, test)
    cmds:
      - task: schema:check
      - task: lint
      - task: build
      - task: test

  deps-verify:
    desc: Verify dependencies are correct
    cmds:
      - go mod verify
